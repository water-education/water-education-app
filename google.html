<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest a Game — Nexus Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #00d4ff;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        iframe {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Suggest a Game</h1>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeuYiHdRUWtcNMtGLMmVfpqh2iYBs4RWkDPIjtytofHjAmgwQ/viewform" target="_blank" class="btn">Open External Form ↗</a>
        </div>
        
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeuYiHdRUWtcNMtGLMmVfpqh2iYBs4RWkDPIjtytofHjAmgwQ/viewform?embedded=true">Loading…</iframe>
    </div>

</body>
</html>
