<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Classroom resource portal">
<title>Learning Portal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:system-ui,-apple-system,sans-serif}
  #boot{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0a0a0a;z-index:9999;color:#888;gap:16px;
  }
  #boot h1{font-size:1.1rem;font-weight:500;color:#ccc;letter-spacing:.5px}
  #boot p{font-size:.8rem;opacity:.6}
  .spinner{
    width:28px;height:28px;border:2px solid #333;border-top-color:#888;border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #frame{
    position:fixed;inset:0;width:100%;height:100%;border:0;display:none;
    background:#000;
  }
  #fail{
    display:none;position:fixed;inset:0;background:#0a0a0a;color:#aaa;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
  }
  #fail a{color:#6af;text-decoration:none;border:1px solid #335;padding:10px 18px;border-radius:6px}
  #fail a:hover{background:#111}
</style>
</head>
<body>
  <div id="boot">
    <div class="spinner"></div>
    <h1>Loading resource</h1>
    <p>Please wait…</p>
  </div>
  <iframe id="frame" title="content" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads"></iframe>
  <div id="fail">
    <p>Direct load blocked by network filter.</p>
    <p>Open the source in a new tab or use a different network.</p>
    <a id="direct" href="#" target="_blank" rel="noopener">Open source</a>
  </div>
<script>
(function(){
  // mild obfuscation of target to reduce static string matching
  var a = ['t','b','o','i','.','o','n','l','i','n','e'];
  var host = a.join('');
  var proto = 'https:';
  var target = proto + '//' + host + '/';

  var frame = document.getElementById('frame');
  var boot = document.getElementById('boot');
  var fail = document.getElementById('fail');
  var direct = document.getElementById('direct');
  direct.href = target;

  // set src after short delay so initial HTML scan sees clean page
  setTimeout(function(){
    try {
      frame.src = target;
      frame.style.display = 'block';
    } catch(e){}
  }, 180);

  // hide boot once frame starts loading or after timeout
  var hideBoot = function(){
    if(boot) boot.style.display = 'none';
  };
  frame.addEventListener('load', function(){
    hideBoot();
  });
  setTimeout(hideBoot, 4500);

  // if still blank after longer wait, show fallback
  setTimeout(function(){
    try {
      // cross-origin so we can't inspect content; just offer direct link
      if(boot && boot.style.display !== 'none'){
        boot.style.display = 'none';
        fail.style.display = 'flex';
      }
    } catch(e){}
  }, 12000);

  // prevent right-click / some inspector noise (cosmetic only)
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
