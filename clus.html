<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
<title>Clustertruck</title>
<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/wasmdotrip/Clustertruck-Port@main/TemplateData/favicon.ico">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}
#unity-container{position:absolute;top:0;left:0;width:100%;height:100%}
#unity-canvas{display:block;width:100%;height:100%;background:#000;outline:none}
#unity-canvas.unity-mobile{image-rendering:optimizeSpeed;image-rendering:pixelated}
#unity-footer{display:none}
#unity-loading-bar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;width:260px}
#unity-progress-bar-empty{width:100%;height:3px;background:#333;border-radius:2px;overflow:hidden}
#unity-progress-bar-full{width:0%;height:100%;background:#fff}
#unity-status{margin-top:8px;text-align:center;font-family:Arial,sans-serif;font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#unity-warning{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:11px;color:#d9a441}
#unity-error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;max-width:80%;text-align:center;font-family:Arial,sans-serif;font-size:12px;color:#d97070;line-height:1.4}
#fps-hud{position:absolute;top:6px;left:8px;font:11px/1.2 monospace;color:#0f0;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:3px;z-index:10;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="unity-container">
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="unity-loading-bar">
<div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
<div id="unity-status"></div>
</div>
<div id="unity-warning"></div>
<div id="unity-error"></div>
<div id="fps-hud">-- FPS</div>
</div>
<script>
(function(){
  var container=document.querySelector("#unity-container"),
      canvas=document.querySelector("#unity-canvas"),
      loadingBar=document.querySelector("#unity-loading-bar"),
      progressBarFull=document.querySelector("#unity-progress-bar-full"),
      statusText=document.querySelector("#unity-status"),
      warningBanner=document.querySelector("#unity-warning"),
      errorBox=document.querySelector("#unity-error"),
      fpsHud=document.querySelector("#fps-hud");

  function showError(msg){
    loadingBar.style.display="none";
    errorBox.style.display="block";
    errorBox.innerHTML=msg;
  }

  function unityShowBanner(msg,type){
    var div=document.createElement("div");
    div.innerHTML=msg;
    warningBanner.appendChild(div);
    if(type!=="error"){
      setTimeout(function(){
        if(div.parentNode)warningBanner.removeChild(div);
        warningBanner.style.display=warningBanner.children.length?"block":"none";
      },4000);
    }
    warningBanner.style.display="block";
  }

  // ---- Device tiering ----
  var cores=navigator.hardwareConcurrency||2;
  var isChromebook=/\bCrOS\b/.test(navigator.userAgent);
  var isDualCore=cores<=2;
  var isLowEnd=isChromebook||cores<=4;
  // Extra-weak signal: very little RAM or old ChromeOS
  var mem=navigator.deviceMemory||4;
  var isVeryLow=isDualCore||(isChromebook&&mem<=4)||cores<=2;

  var repoBase="https://cdn.jsdelivr.net/gh/wasmdotrip/Clustertruck-Port@main/",
      buildUrl=repoBase+"Build",
      loaderUrl=buildUrl+"/ClusterTruckWEB.loader.js",
      frameworkUrl=buildUrl+"/ClusterTruckWEB.framework.js",
      dataUrl=buildUrl+"/ClusterTruckWEB.data",
      wasmUrl=buildUrl+"/ClusterTruckWEB.wasm",
      MAX_PARTS=64;

  // Conservative concurrency = less memory pressure + less driver contention
  var DISCOVERY_CONCURRENCY=isVeryLow?1:(isLowEnd?2:3);
  var DOWNLOAD_CONCURRENCY=isVeryLow?1:(isLowEnd?1:2);
  var FETCH_TIMEOUT_MS=25000;
  var MAX_RETRIES=2;

  function basename(url){return url.split("/").pop();}

  function fetchWithTimeout(url,opts){
    var controller=("AbortController" in window)?new AbortController():null;
    var mergedOpts=opts||{};
    if(controller){
      mergedOpts=Object.assign({},opts,{signal:controller.signal});
    }
    var timer=controller?setTimeout(function(){controller.abort();},FETCH_TIMEOUT_MS):null;
    return fetch(url,mergedOpts).finally(function(){
      if(timer)clearTimeout(timer);
    });
  }

  async function fetchWithRetry(url,opts){
    var lastErr;
    for(var attempt=0;attempt<=MAX_RETRIES;attempt++){
      try{
        return await fetchWithTimeout(url,opts);
      }catch(e){
        lastErr=e;
        if(attempt<MAX_RETRIES)await new Promise(function(r){setTimeout(r,300+attempt*200);});
      }
    }
    throw lastErr;
  }

  async function discoverParts(url){
    var parts=[], i=1, done=false;
    async function worker(){
      while(!done&&i<=MAX_PARTS){
        var idx=i++;
        var partUrl=url+".part"+idx;
        try{
          var res=await fetchWithRetry(partUrl,{method:"HEAD",cache:"force-cache"});
          if(!res.ok){done=true;return;}
          var len=parseInt(res.headers.get("content-length")||"0",10);
          parts[idx-1]={url:partUrl,size:isNaN(len)?0:len};
        }catch(e){done=true;}
      }
    }
    var workers=[];
    for(var w=0;w<DISCOVERY_CONCURRENCY;w++)workers.push(worker());
    await Promise.all(workers);
    var out=[];
    for(var j=0;j<parts.length;j++)if(parts[j])out.push(parts[j]);
    return out;
  }

  async function fetchPart(url,onBytes){
    var res=await fetchWithRetry(url,{cache:"force-cache"});
    if(!res.ok)throw new Error("Failed "+url+" ("+res.status+")");
    if(!res.body){
      var buf=await res.arrayBuffer();
      onBytes(buf.byteLength);
      return new Uint8Array(buf);
    }
    var reader=res.body.getReader(), chunks=[], total=0;
    while(true){
      var step=await reader.read();
      if(step.done)break;
      chunks.push(step.value);
      total+=step.value.length;
      onBytes(step.value.length);
    }
    var out=new Uint8Array(total), offset=0;
    for(var k=0;k<chunks.length;k++){
      out.set(chunks[k],offset);
      offset+=chunks[k].length;
      chunks[k]=null;
    }
    return out;
  }

  var objectUrls=[];

  async function resolveUrl(url,mimeType,plan,onBytes,onFile){
    var parts=plan[url];
    if(!parts||!parts.length)return url;
    var buffers=new Array(parts.length);
    var idx=0;
    async function worker(){
      while(idx<parts.length){
        var i=idx++;
        onFile(basename(parts[i].url));
        buffers[i]=await fetchPart(parts[i].url,onBytes);
      }
    }
    var workers=[];
    for(var w=0;w<DOWNLOAD_CONCURRENCY;w++)workers.push(worker());
    await Promise.all(workers);
    var blob=new Blob(buffers,{type:mimeType});
    buffers.length=0;
    var objUrl=URL.createObjectURL(blob);
    objectUrls.push(objUrl);
    return objUrl;
  }

  // ---- Aggressive resolution control ----
  // matchWebGLToCanvasSize:false lets us own the internal render resolution
  // while CSS keeps the canvas filling the screen (pixelated upscale).
  function applyLowRes(scale){
    var cssW=container.clientWidth||window.innerWidth;
    var cssH=container.clientHeight||window.innerHeight;
    // Clamp so we never go below a usable size or above native
    var targetW=Math.max(320,Math.floor(cssW*scale));
    var targetH=Math.max(180,Math.floor(cssH*scale));
    if(canvas.width!==targetW||canvas.height!==targetH){
      canvas.width=targetW;
      canvas.height=targetH;
    }
  }

  async function boot(){
    loadingBar.style.display="block";
    statusText.textContent="Checking files...";

    var plan={}, dataParts, wasmParts;
    [dataParts,wasmParts]=await Promise.all([
      discoverParts(dataUrl),
      discoverParts(wasmUrl)
    ]);
    plan[dataUrl]=dataParts;
    plan[wasmUrl]=wasmParts;

    var totalBytes=0;
    Object.keys(plan).forEach(function(k){
      plan[k].forEach(function(p){totalBytes+=p.size;});
    });

    var loadedBytes=0, currentFile="";
    function onBytes(n){
      loadedBytes+=n;
      if(totalBytes>0){
        var frac=Math.min(loadedBytes/totalBytes,1);
        progressBarFull.style.width=(frac*90)+"%";
        statusText.textContent=currentFile+" — "+Math.round(frac*100)+"%";
      }
    }
    function onFile(name){
      currentFile=name;
      statusText.textContent=currentFile;
    }

    var resolvedData,resolvedWasm;
    [resolvedData,resolvedWasm]=await Promise.all([
      resolveUrl(dataUrl,"application/octet-stream",plan,onBytes,onFile),
      resolveUrl(wasmUrl,"application/wasm",plan,onBytes,onFile)
    ]);

    statusText.textContent="Starting...";

    // ---- Resolution / DPR strategy ----
    // Very aggressive on dual-core / Chromebook: ~0.35–0.40 of screen pixels.
    // This is the single biggest FPS lever on weak iGPUs.
    var renderScale;
    if(isVeryLow)      renderScale=0.35;
    else if(isLowEnd)  renderScale=0.50;
    else               renderScale=0.75;

    // devicePixelRatio is kept low so Unity's internal logic stays conservative
    var dpr=isVeryLow?0.4:(isLowEnd?0.55:0.8);

    var config={
      dataUrl:resolvedData,
      frameworkUrl:frameworkUrl,
      codeUrl:resolvedWasm,
      streamingAssetsUrl:repoBase+"StreamingAssets",
      companyName:"Landfall",
      productName:"Clustertruck",
      productVersion:"1.0",
      showBanner:unityShowBanner,
      devicePixelRatio:dpr,
      // Critical: stop Unity from forcing canvas buffer = CSS size * DPR
      matchWebGLToCanvasSize:false,
      webglContextAttributes:{
        alpha:false,
        antialias:false,
        depth:true,
        stencil:false,
        preserveDrawingBuffer:false,
        powerPreference:"low-power",
        desynchronized:true,          // can reduce latency / jank on some ChromeOS builds
        failIfMajorPerformanceCaveat:false
      }
    };

    // Force mobile-style pixelated upscale path
    container.className="unity-mobile";
    canvas.className="unity-mobile";

    // Set initial low-res buffer before Unity starts
    applyLowRes(renderScale);

    await new Promise(function(resolve,reject){
      var script=document.createElement("script");
      script.src=loaderUrl;
      script.onload=resolve;
      script.onerror=function(){reject(new Error("Failed to load loader"));};
      document.body.appendChild(script);
    });

    var unityInstance=await createUnityInstance(canvas,config,function(progress){
      progressBarFull.style.width=(90+progress*10)+"%";
    });

    loadingBar.style.display="none";
    objectUrls.forEach(function(u){URL.revokeObjectURL(u);});
    objectUrls.length=0;

    // ---- Post-boot performance knobs ----
    // Try to force 30 FPS target (Unity may or may not expose this on older builds)
    try{
      if(unityInstance.Module&&typeof unityInstance.Module.SetTargetFrameRate==="function"){
        unityInstance.Module.SetTargetFrameRate(30);
      }
    }catch(e){}

    // Keep the canvas buffer at the low resolution even after resize / orientation change
    function onResize(){
      applyLowRes(renderScale);
    }
    window.addEventListener("resize",onResize,{passive:true});
    // Some Chromebooks fire orientationchange without a reliable resize
    window.addEventListener("orientationchange",function(){
      setTimeout(onResize,150);
    },{passive:true});

    // Simple FPS counter so you can see the effect immediately
    fpsHud.style.display="block";
    var frames=0, last=performance.now();
    function tick(now){
      frames++;
      if(now-last>=1000){
        var fps=Math.round(frames*1000/(now-last));
        fpsHud.textContent=fps+" FPS  |  scale "+Math.round(renderScale*100)+"%";
        frames=0;
        last=now;
        // Optional adaptive: if we are still <22 FPS, drop scale a bit more
        if(fps<22&&renderScale>0.28){
          renderScale=Math.max(0.28,renderScale-0.04);
          applyLowRes(renderScale);
        }else if(fps>38&&renderScale<0.55&&isLowEnd){
          // gentle recovery so it doesn't stay ultra-blurry forever
          renderScale=Math.min(0.55,renderScale+0.03);
          applyLowRes(renderScale);
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Fullscreen on F
    window.addEventListener("keydown",function(e){
      if((e.key==="F"||e.key==="f")&&(e.target===document.body||e.target===canvas)){
        unityInstance.SetFullscreen(1);
      }
      // Press R to cycle resolution scale manually for testing
      if((e.key==="R"||e.key==="r")&&(e.target===document.body||e.target===canvas)){
        if(renderScale<=0.30)renderScale=0.45;
        else if(renderScale<=0.45)renderScale=0.60;
        else renderScale=0.30;
        applyLowRes(renderScale);
      }
    },{passive:true});
  }

  boot().catch(function(err){
    showError("<b>Failed to start.</b><br>"+(err&&err.message?err.message:err));
    console.error(err);
  });
})();
</script>
</body>
</html>
